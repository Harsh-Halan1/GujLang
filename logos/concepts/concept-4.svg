<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <g id="background">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#101512" stroke="#253228" stroke-width="6"/>
  </g>
  <g id="icon">
    <!-- Network Graph Interconnects / AST Branches -->
    <!-- Root to Mid Levels -->
    <line x1="256" y1="390" x2="160" y2="280" stroke="#2c3e30" stroke-width="12" stroke-linecap="round"/>
    <line x1="256" y1="390" x2="352" y2="280" stroke="#2c3e30" stroke-width="12" stroke-linecap="round"/>
    <line x1="256" y1="390" x2="256" y2="260" stroke="#73bea0" stroke-width="14" stroke-linecap="round"/>

    <!-- Mid Level Connections -->
    <line x1="160" y1="280" x2="352" y2="280" stroke="#2c3e30" stroke-width="8" stroke-dasharray="12 12"/>
    <line x1="160" y1="280" x2="120" y2="160" stroke="#73bea0" stroke-width="12" stroke-linecap="round"/>
    <line x1="160" y1="280" x2="210" y2="160" stroke="#2c3e30" stroke-width="10" stroke-linecap="round"/>
    <line x1="352" y1="280" x2="302" y2="160" stroke="#2c3e30" stroke-width="10" stroke-linecap="round"/>
    <line x1="352" y1="280" x2="392" y2="160" stroke="#73bea0" stroke-width="12" stroke-linecap="round"/>

    <!-- Upper Convergent Canopy -->
    <line x1="256" y1="260" x2="256" y2="110" stroke="#b2d77a" stroke-width="16" stroke-linecap="round"/>
    <line x1="120" y1="160" x2="256" y2="110" stroke="#b2d77a" stroke-width="12" stroke-linecap="round"/>
    <line x1="392" y1="160" x2="256" y2="110" stroke="#b2d77a" stroke-width="12" stroke-linecap="round"/>

    <!-- Graph Coloring Register Nodes -->
    <!-- Root Node (Source Program) -->
    <circle cx="256" cy="390" r="28" fill="#1c251f" stroke="#73bea0" stroke-width="10"/>
    <circle cx="256" cy="390" r="12" fill="#73bea0"/>

    <!-- Mid Tier Register Nodes (Graph Coloring: Lime & Mint) -->
    <circle cx="160" cy="280" r="24" fill="#b2d77a"/>
    <circle cx="160" cy="280" r="10" fill="#101512"/>

    <circle cx="352" cy="280" r="24" fill="#73bea0"/>
    <circle cx="352" cy="280" r="10" fill="#101512"/>

    <!-- Center VM Execution Hub (Amber) -->
    <circle cx="256" cy="260" r="30" fill="#d8ad68"/>
    <circle cx="256" cy="260" r="14" fill="#101512"/>

    <!-- Upper AST Leaves -->
    <circle cx="120" cy="160" r="18" fill="#73bea0"/>
    <circle cx="210" cy="160" r="14" fill="#d8ad68"/>
    <circle cx="302" cy="160" r="14" fill="#b2d77a"/>
    <circle cx="392" cy="160" r="18" fill="#d8ad68"/>

    <!-- Canopy Crown Apex (Compiled Output) -->
    <circle cx="256" cy="110" r="26" fill="#f4faf0" stroke="#b2d77a" stroke-width="8"/>
    <circle cx="256" cy="110" r="10" fill="#b2d77a"/>
  </g>
</svg>
